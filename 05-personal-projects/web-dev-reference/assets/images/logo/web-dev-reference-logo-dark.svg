<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 220"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Web Development Reference dark theme logo</title>
  <desc id="desc">Iridescent obsidian code mark beside the words Web Development Reference.</desc>

  <defs>
    <linearGradient id="markLeft" x1="58" y1="52" x2="178" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f8f95"/>
      <stop offset=".52" stop-color="#1f75b5"/>
      <stop offset="1" stop-color="#6848b8"/>
    </linearGradient>

    <linearGradient id="markCenter" x1="190" y1="36" x2="190" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d9d2c"/>
      <stop offset=".36" stop-color="#21846d"/>
      <stop offset=".72" stop-color="#0f8f95"/>
      <stop offset="1" stop-color="#1f75b5"/>
    </linearGradient>

    <linearGradient id="markRight" x1="202" y1="52" x2="322" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c7832f"/>
      <stop offset=".52" stop-color="#c14f3a"/>
      <stop offset="1" stop-color="#b52c7f"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="372" y1="0" x2="892" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071112"/>
      <stop offset=".18" stop-color="#0f8f95"/>
      <stop offset=".38" stop-color="#6848b8"/>
      <stop offset=".56" stop-color="#b52c7f"/>
      <stop offset=".74" stop-color="#c7832f"/>
      <stop offset=".90" stop-color="#1f75b5"/>
      <stop offset="1" stop-color="#140c0c"/>
    </linearGradient>
  </defs>


  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 55 82 110l68 55" stroke="url(#markLeft)" stroke-width="28"/>
    <path d="M190 44v132" stroke="url(#markCenter)" stroke-width="28"/>
    <path d="m230 55 68 55-68 55" stroke="url(#markRight)" stroke-width="28"/>
  </g>

  <g font-family="Montserrat, Inter, Arial, sans-serif">
    <text x="370" y="94"
          fill="#ffffff"
          font-size="50"
          font-weight="700"
          letter-spacing="1">WEB DEVELOPMENT</text>
    <text x="372" y="145"
          fill="#48b7ba"
          font-size="29"
          font-weight="600"
          letter-spacing="9">REFERENCE</text>
  </g>

  <rect x="372" y="168" width="520" height="5" rx="2.5"
        fill="url(#accentLine)"/>
</svg>

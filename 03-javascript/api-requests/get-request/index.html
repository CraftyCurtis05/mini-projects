<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Smith</title>
  <link rel="stylesheet" href="public/style.css">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro|Work+Sans:200,500" rel="stylesheet">
</head>

<body>
  <header>
    <img
      src="https://content.codecademy.com/courses/intermediate-javascript-requests/wordsmith_logo.svg"
      class="logo"
      alt="Word Smith"
    >
  </header>

  <main id="main">
    <div class="container">
      <h1>Enter a Word</h1>

      <form id="form" autocomplete="off">
        <label class="visually-hidden" for="input">Word</label>
        <input type="text" id="input" value="" required>
        <button type="submit" id="submit">SUBMIT</button>
      </form>

      <div id="responseField" aria-live="polite"></div>
    </div>
  </main>

  <script src="public/helperFunctions.js"></script>
  <script src="public/main.js"></script>
</body>
</html>

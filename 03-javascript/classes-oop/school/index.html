<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Classes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="project-card">
      <h1>School Classes</h1>
      <p class="project-intro">
        This gives me a quick way to create school objects and see the class
        information without reading console output.
      </p>

      <form id="school-form">
        <div class="row">
          <div>
            <label for="school-name">School name</label>
            <input id="school-name" required>
          </div>

          <div>
            <label for="school-level">Level</label>
            <select id="school-level">
              <option value="primary">Primary</option>
              <option value="middle">Middle</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <label for="student-count">Number of students</label>
        <input id="student-count" type="number" min="1" required>

        <button type="submit">Add school</button>
      </form>

      <div class="output">
        <h2>School Catalog</h2>
        <ul id="school-list" class="item-list"></ul>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkAround Salary Explorer</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <main>
    <header class="page-heading">
      <p class="eyebrow">JavaScript module practice</p>
      <h1>WorkAround Salary Explorer</h1>
      <p>
        Select a company and role to compare the salary data from the exercise.
      </p>
    </header>

    <div id="inputContainer" class="input-grid"></div>

    <section id="resultsContainer" class="results" aria-live="polite">
      <h2>Salary Details</h2>
      <p id="salarySelected">Select a company and a role to see the results.</p>
      <p id="salaryAverageByRole"></p>
      <p id="salaryAverageByCompany"></p>
      <p id="salaryAverageIndustry"></p>
    </section>
  </main>

  <script src="modules/salaryData.js"></script>
  <script src="modules/utilities.js"></script>
  <script src="modules/workAroundModule.js"></script>
  <script src="main.js"></script>
</body>
</html>
